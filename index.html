<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · ERMIS</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
  <main class="login">
    <form class="login-card" id="login-form" novalidate>
      <div class="login-brand"><span class="ph-sq ph-sq-lg"></span><div><div class="login-name">ERMIS</div><div class="login-org">Office of Risk Services</div></div></div>
      <h1>Sign in</h1>

      <div class="callout callout-danger hidden" id="login-error" role="alert"></div>

      <label class="field" id="f-email">
        <span class="field-label">Email address</span>
        <input class="input" type="email" name="email" autocomplete="username" placeholder="Enter your email address">
        <span class="field-error">Enter your email address.</span>
      </label>
      <label class="field" id="f-password">
        <span class="field-label">Password</span>
        <input class="input" type="password" name="password" autocomplete="current-password" placeholder="Enter your password">
        <span class="field-error">Enter your password.</span>
      </label>
      <button class="btn btn-primary login-submit" type="submit" id="login-submit">Sign in</button>
    </form>
  </main>

  <script src="js/core/util.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/shell.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
