name: Deploy wireframes to GitHub Pages

on:
  push:
    branches: [main, concept]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only the wireframe pages. The docs/ folder (client and internal documents) stays out of the site.
      - name: Collect wireframe files
        run: |
          mkdir _site
          cp ./*.html wire.css _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
