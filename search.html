<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk search · ERMIS</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page" id="page">
        <div class="page-head">
          <div>
            <h1>Risk search</h1>
            <p>Search the risk register by meaning to find comparable risks, with the controls and indicators used.</p>
          </div>
        </div>
        <form class="search-bar" id="search-form" role="search">
          <div class="input-group grow"><span data-icon="search"></span><input class="input" name="q" type="search" placeholder="Describe a risk in your own words" aria-label="Describe a risk" autocomplete="off"></div>
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <div class="search-layout">
          <aside class="search-filters" aria-label="Filters">
            <h2>Filters</h2>
            <label class="field"><span class="field-label">Risk domain</span><select class="select"><option>All</option><option>Option 1</option><option>Option 2</option><option>Option 3</option></select></label>
            <label class="field"><span class="field-label">Institution</span><select class="select"><option>All</option><option>Option 1</option><option>Option 2</option><option>Option 3</option></select></label>
            <label class="field"><span class="field-label">Risk level</span><select class="select"><option>All</option><option>Option 1</option><option>Option 2</option><option>Option 3</option></select></label>
            <label class="field"><span class="field-label">Review period</span><select class="select"><option>All</option><option>Option 1</option><option>Option 2</option><option>Option 3</option></select></label>
          </aside>
          <section aria-live="polite">
            <h2 class="sr-title" id="sr-title"></h2>
            <div class="results" id="results"></div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="js/core/util.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/shell.js"></script>
  <script src="js/pages/search.js"></script>
</body>
</html>
