<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERM review · ERMIS</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/review.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page page-review" id="page">
        <div class="review-head no-print">
          <div>
            <h1>New ERM review</h1>
            <p class="review-meta" id="rv-meta"></p>
          </div>
          <button class="btn" id="btn-refs">References</button>
        </div>
        <nav class="stepper no-print" id="stepper" aria-label="Review steps"></nav>
        <div class="review-layout" id="review-layout">
          <div class="review-main" id="step"></div>
          <aside class="review-rail no-print" id="rail" aria-label="Guidance and ERMIS Assist"></aside>
        </div>
        <div class="review-footer no-print" id="review-footer"></div>
      </main>
    </div>
  </div>

  <script src="js/core/util.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/shell.js"></script>
  <script src="js/assist.js"></script>
  <script src="js/pages/review.js"></script>
</body>
</html>
