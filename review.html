<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERM review · ERMIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e8702a'/%3E%3Cpath d='M12 4.5 6.5 6.6v4.6c0 3.7 2.4 6.3 5.5 7.4 3.1-1.1 5.5-3.7 5.5-7.4V6.6z' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/review.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="page page-review" id="page">
        <div class="review-head no-print">
          <div class="review-head-text">
            <h1 id="rv-title">ERM review</h1>
            <p id="rv-meta"></p>
          </div>
          <div class="review-actions">
            <span class="save-state" id="save-state" aria-live="polite"></span>
            <button class="btn" id="btn-refs"></button>
            <a class="btn" href="dashboard.html" id="btn-exit"></a>
          </div>
        </div>

        <nav class="stepper no-print" id="stepper" aria-label="Review steps"></nav>

        <div class="review-layout" id="review-layout">
          <div class="review-main" id="step"></div>
          <aside class="review-rail no-print" id="assist-rail" aria-label="ERMIS Assist"></aside>
        </div>

        <div class="review-footer no-print" id="review-footer"></div>
      </main>
    </div>
  </div>

  <script src="js/data/reference.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/rating.js"></script>
  <script src="js/data/corpus.js"></script>
  <script src="js/data/suggestions.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/core/shell.js"></script>
  <script src="js/search-engine.js"></script>
  <script src="js/search-ui.js"></script>
  <script src="js/assist.js"></script>
  <script src="js/pages/review.js"></script>
</body>
</html>
